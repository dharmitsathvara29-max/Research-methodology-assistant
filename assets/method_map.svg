<svg width="100%" height="100%" viewBox="0 0 560 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Method Map: Decision tree connecting research questions to Quantitative, Qualitative, and Mixed Methods paradigms with design, sampling, and analysis specifications">
  <!-- Card Canvas Background -->
  <rect x="2" y="2" width="556" height="416" rx="14" fill="#FFFFFF" stroke="#E7E2D9" stroke-width="1.5"/>

  <!-- Subtle Editorial Coordinate Grid -->
  <line x1="28" y1="2" x2="28" y2="418" stroke="#F8F6F2" stroke-width="1"/>
  <line x1="145" y1="2" x2="145" y2="418" stroke="#F8F6F2" stroke-width="1"/>
  <line x1="265" y1="2" x2="265" y2="418" stroke="#F8F6F2" stroke-width="1"/>
  <line x1="395" y1="2" x2="395" y2="418" stroke="#F8F6F2" stroke-width="1"/>
  <line x1="2" y1="48" x2="558" y2="48" stroke="#F8F6F2" stroke-width="1"/>
  <line x1="2" y1="165" x2="558" y2="165" stroke="#F8F6F2" stroke-width="1"/>
  <line x1="2" y1="285" x2="558" y2="285" stroke="#F8F6F2" stroke-width="1"/>
  <line x1="2" y1="385" x2="558" y2="385" stroke="#F8F6F2" stroke-width="1"/>

  <!-- Top Header Badge -->
  <g id="header-badge">
    <rect x="20" y="14" width="180" height="22" rx="4" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <circle cx="31" cy="25" r="3.5" fill="#3730A3"/>
    <text x="40" y="29" fill="#3730A3" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.5">METHOD MAP • ARCHITECTURE</text>
  </g>
  <text x="540" y="29" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">Triangulated Engine</text>

  <!-- FLOW CONNECTOR PATHS (Always visible by default) -->
  <!-- Step 1 to Step 2 connector -->
  <line x1="125" y1="210" x2="148" y2="210" stroke="#64748B" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="148,206 154,210 148,214" fill="#64748B"/>

  <!-- Step 2 to Paradigm Branches -->
  <!-- Branch to Quantitative (Top) -->
  <path d="M255 198 C 275 198, 275 92, 298 92" stroke="#3730A3" stroke-width="2" fill="none"/>
  <polygon points="296,88 303,92 296,96" fill="#3730A3"/>

  <!-- Branch to Qualitative (Middle) -->
  <path d="M255 210 L 300 210" stroke="#B45309" stroke-width="2" fill="none"/>
  <polygon points="298,206 304,210 298,214" fill="#B45309"/>

  <!-- Branch to Mixed Methods (Bottom) -->
  <path d="M255 222 C 275 222, 275 328, 298 328" stroke="#0F766E" stroke-width="2" fill="none"/>
  <polygon points="296,324 303,328 296,332" fill="#0F766E"/>

  <!-- Connectors from Paradigms to Specification Pillars (Leaves) -->
  <!-- Quant to Pillars -->
  <path d="M395 78 C 405 78, 408 62, 418 62" stroke="#C7D2FE" stroke-width="1.5" fill="none"/>
  <path d="M395 92 L 418 92" stroke="#C7D2FE" stroke-width="1.5" fill="none"/>
  <path d="M395 106 C 405 106, 408 122, 418 122" stroke="#C7D2FE" stroke-width="1.5" fill="none"/>

  <!-- Qual to Pillars -->
  <path d="M395 196 C 405 196, 408 180, 418 180" stroke="#FDE68A" stroke-width="1.5" fill="none"/>
  <path d="M395 210 L 418 210" stroke="#FDE68A" stroke-width="1.5" fill="none"/>
  <path d="M395 224 C 405 224, 408 240, 418 240" stroke="#FDE68A" stroke-width="1.5" fill="none"/>

  <!-- Mixed to Pillars -->
  <path d="M395 314 C 405 314, 408 298, 418 298" stroke="#99F6E4" stroke-width="1.5" fill="none"/>
  <path d="M395 328 L 418 328" stroke="#99F6E4" stroke-width="1.5" fill="none"/>
  <path d="M395 342 C 405 342, 408 358, 418 358" stroke="#99F6E4" stroke-width="1.5" fill="none"/>

  <!-- ==================== NODES (Always visible) ==================== -->

  <!-- NODE 1: Research Question -->
  <g id="node-rq">
    <rect x="18" y="178" width="107" height="64" rx="8" fill="#3730A3" stroke="#1E1B4B" stroke-width="1.5"/>
    <text x="71" y="202" fill="#FFFFFF" font-family="'Crimson Pro', Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">Research</text>
    <text x="71" y="218" fill="#FFFFFF" font-family="'Crimson Pro', Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">Question</text>
    <rect x="28" y="226" width="87" height="12" rx="2" fill="#312E81"/>
    <text x="71" y="235" fill="#C7D2FE" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">INQUIRY INPUT</text>
  </g>

  <!-- NODE 2: Question Analysis -->
  <g id="node-analysis">
    <rect x="154" y="178" width="101" height="64" rx="8" fill="#FAF7F2" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="204" y="200" fill="#0F172A" font-family="'Crimson Pro', Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">Question</text>
    <text x="204" y="216" fill="#0F172A" font-family="'Crimson Pro', Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">Analysis</text>
    <text x="204" y="232" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Scope • Variables</text>
  </g>

  <!-- PARADIGM NODES -->
  <!-- 1. Quantitative -->
  <g id="node-quant">
    <rect x="303" y="66" width="92" height="52" rx="7" fill="#FFFFFF" stroke="#3730A3" stroke-width="1.5"/>
    <rect x="306" y="69" width="4" height="46" rx="2" fill="#3730A3"/>
    <text x="351" y="88" fill="#0F172A" font-family="'Crimson Pro', Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">Quantitative</text>
    <text x="351" y="104" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Causal • Deductive</text>
  </g>

  <!-- 2. Qualitative -->
  <g id="node-qual">
    <rect x="303" y="184" width="92" height="52" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <rect x="306" y="187" width="4" height="46" rx="2" fill="#B45309"/>
    <text x="351" y="206" fill="#0F172A" font-family="'Crimson Pro', Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">Qualitative</text>
    <text x="351" y="222" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Lived • Inductive</text>
  </g>

  <!-- 3. Mixed Methods -->
  <g id="node-mixed">
    <rect x="303" y="302" width="92" height="52" rx="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="306" y="305" width="4" height="46" rx="2" fill="#0F766E"/>
    <text x="351" y="324" fill="#0F172A" font-family="'Crimson Pro', Georgia, serif" font-size="13.5" font-weight="700" text-anchor="middle">Mixed Meth.</text>
    <text x="351" y="340" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Pragmatic • Joint</text>
  </g>

  <!-- SPECIFICATION PILLARS (DESIGN, SAMPLING, ANALYSIS) -->
  <!-- Quantitative Pillars -->
  <g id="pillars-quant">
    <!-- Design -->
    <rect x="418" y="52" width="126" height="20" rx="4" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="424" y="66" fill="#3730A3" font-family="'Atkinson Hyperlegible', sans-serif" font-size="10.5" font-weight="700">Design: RCT / Quasi</text>
    <!-- Sampling -->
    <rect x="418" y="82" width="126" height="20" rx="4" fill="#FAF7F2" stroke="#E2E8F0" stroke-width="1"/>
    <text x="424" y="96" fill="#334155" font-family="'Atkinson Hyperlegible', sans-serif" font-size="10" font-weight="600">Sampling: G*Power</text>
    <!-- Analysis -->
    <rect x="418" y="112" width="126" height="20" rx="4" fill="#FAF7F2" stroke="#E2E8F0" stroke-width="1"/>
    <text x="424" y="126" fill="#334155" font-family="'Atkinson Hyperlegible', sans-serif" font-size="10" font-weight="600">Analysis: ANCOVA / OLS</text>
  </g>

  <!-- Qualitative Pillars -->
  <g id="pillars-qual">
    <!-- Design -->
    <rect x="418" y="170" width="126" height="20" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="424" y="184" fill="#92400E" font-family="'Atkinson Hyperlegible', sans-serif" font-size="10.5" font-weight="700">Design: IPA / Thematic</text>
    <!-- Sampling -->
    <rect x="418" y="200" width="126" height="20" rx="4" fill="#FAF7F2" stroke="#E2E8F0" stroke-width="1"/>
    <text x="424" y="214" fill="#334155" font-family="'Atkinson Hyperlegible', sans-serif" font-size="10" font-weight="600">Sampling: Saturation</text>
    <!-- Analysis -->
    <rect x="418" y="230" width="126" height="20" rx="4" fill="#FAF7F2" stroke="#E2E8F0" stroke-width="1"/>
    <text x="424" y="244" fill="#334155" font-family="'Atkinson Hyperlegible', sans-serif" font-size="10" font-weight="600">Analysis: Reflexive Code</text>
  </g>

  <!-- Mixed Methods Pillars -->
  <g id="pillars-mixed">
    <!-- Design -->
    <rect x="418" y="288" width="126" height="20" rx="4" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
    <text x="424" y="302" fill="#0F766E" font-family="'Atkinson Hyperlegible', sans-serif" font-size="10.5" font-weight="700">Design: Explanatory</text>
    <!-- Sampling -->
    <rect x="418" y="318" width="126" height="20" rx="4" fill="#FAF7F2" stroke="#E2E8F0" stroke-width="1"/>
    <text x="424" y="332" fill="#334155" font-family="'Atkinson Hyperlegible', sans-serif" font-size="10" font-weight="600">Sampling: Multi-phase</text>
    <!-- Analysis -->
    <rect x="418" y="348" width="126" height="20" rx="4" fill="#FAF7F2" stroke="#E2E8F0" stroke-width="1"/>
    <text x="424" y="362" fill="#334155" font-family="'Atkinson Hyperlegible', sans-serif" font-size="10" font-weight="600">Analysis: Joint Display</text>
  </g>

  <!-- Bottom Legend / Caption -->
  <g id="bottom-caption">
    <rect x="18" y="388" width="524" height="20" rx="4" fill="#FAF7F2" stroke="#E7E2D9" stroke-width="1"/>
    <text x="280" y="402" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Decision Pipeline: Research Question → Analysis → Paradigm Alignment → Design, Sampling &amp; Analysis</text>
  </g>
</svg>
